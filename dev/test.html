<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bosch Dishwasher Card — Dev Harness</title>
  <style>
    body { background: #1a1a2e; display: flex; gap: 20px; padding: 20px; flex-wrap: wrap; }
    .scenario { display: flex; flex-direction: column; gap: 6px; }
    .scenario label { color: #8b949e; font: 11px/1 monospace; }
    button { padding: 6px 10px; border-radius: 6px; border: 0; cursor: pointer; }
  </style>
</head>
<body>

<!-- Scenario buttons to switch mock state -->
<div style="position:fixed;top:10px;right:10px;display:flex;flex-direction:column;gap:6px;z-index:100;">
  <button onclick="setState('running')">▶ Running</button>
  <button onclick="setState('idle')">⏸ Idle</button>
  <button onclick="setState('finished')">✓ Finished</button>
  <button onclick="setState('aborted')">⚠ Aborted</button>
  <button onclick="setState('warnings')">⚠ Warnings</button>
  <hr>
  <button onclick="setMode('device')">device-id mode</button>
  <button onclick="setMode('legacy')">legacy prefix mode</button>
  <button onclick="setMode('two')">two dishwashers</button>
</div>

<div class="scenario">
  <label>CURRENT STATE</label>
  <bosch-dishwasher-card id="card"></bosch-dishwasher-card>
</div>

<script type="module">
  import '../bosch-dishwasher-card.js';

  // Capability → (domain, suffix, translation_key) for the primary dishwasher.
  // Used to build both states + entity registry mocks consistently.
  const CAPS = [
    ['switch',        'power',                  'power'],
    ['switch',        'child_lock',             'child_lock'],
    ['switch',        'vario_speed_plus',       'vario_speed_plus'],
    ['switch',        'silence_on_demand',      'silence_on_demand'],
    ['switch',        'extra_dry',              'extra_dry'],
    ['switch',        'half_load',              'half_load'],
    ['select',        'active_program',         'active_program'],
    ['select',        'selected_program',       'selected_program'],
    ['sensor',        'door',                   'door_state'],
    ['sensor',        'operation_state',        'operation_state'],
    ['sensor',        'program_progress',       'program_progress'],
    ['sensor',        'program_finish_time',    'remaining_program_time'],
    ['binary_sensor', 'salt_nearly_empty',      'salt_nearly_empty'],
    ['binary_sensor', 'rinse_aid_nearly_empty', 'rinse_aid_nearly_empty'],
    ['binary_sensor', 'remote_control',         'remote_control'],
    ['button',        'stop_program',           'stop_program'],
  ];

  const DEVICE_ID_MAIN = 'dev_lavavajillas_main';
  const DEVICE_ID_GUEST = 'dev_lavavajillas_guest';

  const BASE_STATES = {
    'switch.lavavajillas_power':                  { state: 'on',      attributes: {} },
    'switch.lavavajillas_silence_on_demand':      { state: 'off',     attributes: {} },
    'switch.lavavajillas_vario_speed_plus':       { state: 'off',     attributes: {} },
    'switch.lavavajillas_extra_dry':              { state: 'off',     attributes: {} },
    'switch.lavavajillas_half_load':              { state: 'off',     attributes: {} },
    'switch.lavavajillas_child_lock':             { state: 'off',     attributes: {} },
    'select.lavavajillas_active_program':         { state: 'Eco 50°', attributes: {} },
    'select.lavavajillas_selected_program':       {
      state: 'Eco 50°',
      attributes: { options: ['Auto 45-65°', 'Eco 50°', 'Intensivo 70°', 'Rápido 45°', 'Pre-lavado'] }
    },
    'button.lavavajillas_stop_program':           { state: 'unknown', attributes: {} },
    'sensor.lavavajillas_door':                   { state: 'Closed',  attributes: {} },
    'sensor.lavavajillas_operation_state':        { state: 'Run',     attributes: {} },
    'sensor.lavavajillas_program_finish_time':    { state: '42 min',  attributes: {} },
    'sensor.lavavajillas_program_progress':       { state: '65',      attributes: {} },
    'binary_sensor.lavavajillas_remote_control':  { state: 'on',      attributes: {} },
    'binary_sensor.lavavajillas_rinse_aid_nearly_empty': { state: 'off', attributes: {} },
    'binary_sensor.lavavajillas_salt_nearly_empty':      { state: 'off', attributes: {} },
  };

  const SCENARIOS = {
    running: {
      'sensor.lavavajillas_operation_state':  { state: 'Run' },
      'sensor.lavavajillas_program_progress': { state: '65' },
    },
    idle: {
      'sensor.lavavajillas_operation_state':     { state: 'Ready' },
      'sensor.lavavajillas_program_progress':    { state: '0' },
      'sensor.lavavajillas_program_finish_time': { state: '0' },
      'select.lavavajillas_active_program':      { state: 'unavailable' },
    },
    finished: {
      'sensor.lavavajillas_operation_state':  { state: 'Finished' },
      'sensor.lavavajillas_program_progress': { state: '100' },
    },
    aborted: {
      'sensor.lavavajillas_operation_state':  { state: 'Aborting' },
      'sensor.lavavajillas_program_progress': { state: '30' },
    },
    warnings: {
      'sensor.lavavajillas_operation_state':                { state: 'Run' },
      'binary_sensor.lavavajillas_salt_nearly_empty':       { state: 'on' },
      'binary_sensor.lavavajillas_rinse_aid_nearly_empty':  { state: 'on' },
      'sensor.lavavajillas_door':                           { state: 'Open' },
    },
  };

  // Build hass.entities registry — what the new device-picker lookup walks.
  function buildEntityRegistry(prefix, deviceId) {
    const entries = {};
    for (const [domain, suffix, tkey] of CAPS) {
      const entity_id = `${domain}.${prefix}_${suffix}`;
      entries[entity_id] = {
        entity_id,
        device_id: deviceId,
        translation_key: tkey,
        platform: 'bosch_dishwasher',
      };
    }
    return entries;
  }

  function makeHass(overrides = {}, mode = 'device') {
    const states = {};
    for (const [id, val] of Object.entries(BASE_STATES)) {
      states[id] = { ...val, attributes: { ...val.attributes } };
    }
    for (const [id, patch] of Object.entries(overrides)) {
      const base = states[id] || {};
      states[id] = {
        ...base,
        ...patch,
        attributes: { ...(base.attributes || {}), ...(patch.attributes || {}) },
      };
    }

    const entities = buildEntityRegistry('lavavajillas', DEVICE_ID_MAIN);
    const devices = {
      [DEVICE_ID_MAIN]: { id: DEVICE_ID_MAIN, name: 'Lavavajillas', name_by_user: null },
    };
    if (mode === 'two') {
      Object.assign(entities, buildEntityRegistry('lavavajillas_guest', DEVICE_ID_GUEST));
      devices[DEVICE_ID_GUEST] = { id: DEVICE_ID_GUEST, name: 'Lavavajillas invitados', name_by_user: null };
    }

    return {
      states,
      entities,
      devices,
      locale: { language: 'es' },
      callService(domain, service, data) {
        console.log('callService:', domain, service, data);
      },
    };
  }

  let currentMode = 'device';
  let currentScenario = 'running';

  const card = document.getElementById('card');

  function applyConfig() {
    if (currentMode === 'legacy') {
      card.setConfig({ entity_prefix: 'lavavajillas', name: 'Lavavajillas' });
    } else {
      card.setConfig({ device: DEVICE_ID_MAIN, name: 'Lavavajillas' });
    }
    card.hass = makeHass(SCENARIOS[currentScenario] || {}, currentMode);
  }

  applyConfig();

  window.setState = (scenario) => {
    currentScenario = scenario;
    card.hass = makeHass(SCENARIOS[scenario] || {}, currentMode);
  };
  window.setMode = (mode) => {
    currentMode = mode;
    applyConfig();
  };
</script>
</body>
</html>
