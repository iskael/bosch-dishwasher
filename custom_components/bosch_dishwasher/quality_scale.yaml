rules:
  # Bronze
  action-setup:
    status: exempt
    comment: This integration registers no actions.
  appropriate-polling:
    status: done
    comment: |
      The integration is push-based via SSE. Coordinator update_interval is set
      to 30 minutes purely as a safety-net poll if the SSE stream dies silently.
  brands:
    status: todo
    comment: |
      Brand icons are shipped inline under custom_components/bosch_dishwasher/brand/
      per the HA 2026.3 brands proxy API, and HA core renders them correctly.
      The home-assistant/brands repo no longer accepts custom integrations.
  common-modules: done
  config-flow-test-coverage: todo
  config-flow: done
  dependency-transparency: done
